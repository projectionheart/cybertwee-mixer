<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>cyberfermentation dashboard</title>
<meta name="description" content="mix two visual sources into a cute glitchy mashup. test tubes, blend modes, chaos.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=VT323&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="crt-overlay"></div>
<div class="grid-floor"></div>

<header>
  <p class="plate-number">[ accelerant.exe // booting ]</p>
  <h1 class="glitch-title" data-text="CYBERFERMENTATION DASHBOARD">CYBERFERMENTATION DASHBOARD</h1>
  <p class="tagline">mix. mutate. accelerate. <span aria-hidden="true">💗⚡🧪</span></p>
</header>

<main class="lab">

  <section class="tube-row">

    <div class="tube-slot" id="slotA">
      <label class="tube-label">Source A</label>
      <div class="tube" id="tubeA" role="button" tabindex="0" aria-label="Upload source A image">
        <div class="tube-rim"></div>
        <svg class="tube-outline" viewBox="0 0 1 1" preserveAspectRatio="none" aria-hidden="true">
          <path d="M0.5,0.39 C0.7375,0.39 0.93,0.484 0.93,0.6 C0.93,0.716 0.7375,0.81 0.5,0.81 C0.2625,0.81 0.07,0.716 0.07,0.6 C0.07,0.484 0.2625,0.39 0.5,0.39 Z M0.5,0.245 C0.6105,0.245 0.7,0.2786 0.7,0.32 C0.7,0.3614 0.6105,0.395 0.5,0.395 C0.3895,0.395 0.3,0.3614 0.3,0.32 C0.3,0.2786 0.3895,0.245 0.5,0.245 Z M0.5,0.18 C0.5331,0.18 0.56,0.1979 0.56,0.22 C0.56,0.2421 0.5331,0.26 0.5,0.26 C0.4669,0.26 0.44,0.2421 0.44,0.22 C0.44,0.1979 0.4669,0.18 0.5,0.18 Z M0.86,0.55 L0.9,0.42 Q1.02,0.3 0.99,0.27 Q0.94,0.38 0.86,0.46 Z M0.1,0.46 Q-0.02,0.5 -0.01,0.62 Q-0.02,0.76 0.1,0.8 L0.1,0.72 Q0.03,0.69 0.03,0.62 Q0.03,0.55 0.1,0.53 Z" />
        </svg>
        <canvas class="tube-canvas" id="canvasA"></canvas>
        <div class="tube-bubbles">
          <span></span><span></span><span></span><span></span><span></span>
        </div>
        <div class="tube-placeholder">tap 2 add<br>source A ✨</div>
      </div>
      <input type="file" accept="image/*" id="fileA" hidden>
    </div>

    <div class="mix-controls">
      <div class="control">
        <label for="blendMode">blend mode</label>
        <select id="blendMode">
          <option value="random" selected>✨ random chaos</option>
          <option value="screen">screen</option>
          <option value="multiply">multiply</option>
          <option value="difference">difference</option>
          <option value="overlay">overlay</option>
          <option value="color-dodge">color-dodge</option>
          <option value="exclusion">exclusion</option>
          <option value="soft-light">soft-light</option>
          <option value="hard-light">hard-light</option>
        </select>
      </div>

      <div class="control">
        <label for="accel">acceleration <span id="accelVal">30</span>%</label>
        <input type="range" id="accel" min="0" max="100" value="30">
      </div>

      <button id="mixBtn" class="mix-btn">⚗️ MIX IT ⚗️</button>
      <button id="accelerateBtn" class="accelerate-btn" disabled>💥 ACCELERATE MORE</button>
    </div>

    <div class="tube-slot" id="slotB">
      <label class="tube-label">Source B</label>
      <div class="tube" id="tubeB" role="button" tabindex="0" aria-label="Upload source B image">
        <div class="tube-rim"></div>
        <svg class="tube-outline" viewBox="0 0 1 1" preserveAspectRatio="none" aria-hidden="true">
          <path d="M0.5,0.39 C0.7375,0.39 0.93,0.484 0.93,0.6 C0.93,0.716 0.7375,0.81 0.5,0.81 C0.2625,0.81 0.07,0.716 0.07,0.6 C0.07,0.484 0.2625,0.39 0.5,0.39 Z M0.5,0.245 C0.6105,0.245 0.7,0.2786 0.7,0.32 C0.7,0.3614 0.6105,0.395 0.5,0.395 C0.3895,0.395 0.3,0.3614 0.3,0.32 C0.3,0.2786 0.3895,0.245 0.5,0.245 Z M0.5,0.18 C0.5331,0.18 0.56,0.1979 0.56,0.22 C0.56,0.2421 0.5331,0.26 0.5,0.26 C0.4669,0.26 0.44,0.2421 0.44,0.22 C0.44,0.1979 0.4669,0.18 0.5,0.18 Z M0.86,0.55 L0.9,0.42 Q1.02,0.3 0.99,0.27 Q0.94,0.38 0.86,0.46 Z M0.1,0.46 Q-0.02,0.5 -0.01,0.62 Q-0.02,0.76 0.1,0.8 L0.1,0.72 Q0.03,0.69 0.03,0.62 Q0.03,0.55 0.1,0.53 Z" />
        </svg>
        <canvas class="tube-canvas" id="canvasB"></canvas>
        <div class="tube-bubbles">
          <span></span><span></span><span></span><span></span><span></span>
        </div>
        <div class="tube-placeholder">tap 2 add<br>source B ✨</div>
      </div>
      <input type="file" accept="image/*" id="fileB" hidden>
    </div>

  </section>

  <section class="result-row">
    <div class="tube result-tube" id="resultTube">
      <div class="tube-rim"></div>
      <svg class="tube-outline" viewBox="0 0 1 1" preserveAspectRatio="none" aria-hidden="true">
        <path d="M0.5,0.39 C0.7375,0.39 0.93,0.484 0.93,0.6 C0.93,0.716 0.7375,0.81 0.5,0.81 C0.2625,0.81 0.07,0.716 0.07,0.6 C0.07,0.484 0.2625,0.39 0.5,0.39 Z M0.5,0.245 C0.6105,0.245 0.7,0.2786 0.7,0.32 C0.7,0.3614 0.6105,0.395 0.5,0.395 C0.3895,0.395 0.3,0.3614 0.3,0.32 C0.3,0.2786 0.3895,0.245 0.5,0.245 Z M0.5,0.18 C0.5331,0.18 0.56,0.1979 0.56,0.22 C0.56,0.2421 0.5331,0.26 0.5,0.26 C0.4669,0.26 0.44,0.2421 0.44,0.22 C0.44,0.1979 0.4669,0.18 0.5,0.18 Z M0.86,0.55 L0.9,0.42 Q1.02,0.3 0.99,0.27 Q0.94,0.38 0.86,0.46 Z M0.1,0.46 Q-0.02,0.5 -0.01,0.62 Q-0.02,0.76 0.1,0.8 L0.1,0.72 Q0.03,0.69 0.03,0.62 Q0.03,0.55 0.1,0.53 Z" />
      </svg>
      <canvas class="tube-canvas" id="resultCanvas" width="500" height="500"></canvas>
      <div class="tube-bubbles">
        <span></span><span></span><span></span><span></span><span></span><span></span>
      </div>
      <div class="tube-placeholder" id="resultPlaceholder">your mashup<br>appears here</div>
      <div class="sparkle-layer" id="sparkleLayer"></div>
    </div>
    <div class="result-actions">
      <button id="remixBtn" disabled>↻ mix again</button>
      <button id="downloadBtn" disabled>⬇ download</button>
    </div>
  </section>

</main>

<div class="toast" id="toast"></div>

<footer>
  <p>built with claude code &middot; static &amp; served on github pages ⚡💾✨</p>
</footer>

<script src="script.js"></script>
</body>
</html>
